<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Run Blaze</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#07150c;font-family:Arial,sans-serif;color:#fff}
button{font:inherit}
.screen{position:fixed;inset:0}

#home{
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(#0b2818,#07150c);
}

.homeCard{
width:min(430px,92vw);
padding:25px 20px;
text-align:center;
background:#10261a;
border-radius:28px;
box-shadow:0 20px 70px #0009;
}

.logo{font-size:42px;font-weight:900}
.sub{opacity:.7;margin:5px 0 20px}

.characters{
display:flex;
gap:12px;
}

.charBtn{
flex:1;
padding:12px;
border:2px solid #38533f;
border-radius:18px;
background:#172f20;
color:#fff;
font-weight:800;
}

.charBtn.active{
border-color:#ffd34d;
}

.charPreview{
height:75px;
display:flex;
justify-content:center;
align-items:center;
}

.mainBtn,.smallBtn,.rowBtn{
width:100%;
padding:14px;
margin-top:10px;
border:0;
border-radius:15px;
font-weight:900;
}

.mainBtn{
background:#ffd34d;
color:#08120b;
font-size:20px;
}

.smallBtn{
background:#d9e6df;
color:#07150c;
}

.note{
font-size:12px;
opacity:.6;
margin-top:12px;
}

#game{display:none;background:#07150c}

canvas{
width:100%;
height:100%;
display:block;
}

#hud{
position:absolute;
top:12px;
left:12px;
right:12px;
display:flex;
justify-content:space-between;
font-weight:900;
pointer-events:none;
}

.hudBox{
padding:8px 11px;
background:#07150cdd;
border-radius:11px;
font-size:13px;
}

#hint{
position:absolute;
bottom:16px;
left:50%;
transform:translateX(-50%);
background:#07150ccc;
padding:8px 12px;
border-radius:12px;
font-size:11px;
white-space:nowrap;
opacity:.75;
}

#gameOver{
display:none;
position:absolute;
inset:0;
align-items:center;
justify-content:center;
background:#000b;
}

.card{
width:min(380px,90vw);
padding:25px;
border-radius:24px;
background:#10261a;
text-align:center;
}

.card h2{font-size:32px;margin-bottom:15px}

.stats{
display:flex;
justify-content:space-around;
margin:15px 0;
font-weight:800;
}

.panel{
display:none;
position:fixed;
inset:0;
z-index:50;
align-items:center;
justify-content:center;
background:#000c;
padding:20px;
}

.rowBtn{
background:#1b3926;
color:#fff;
}

.rowBtn.primary{
background:#ffd34d;
color:#07150c;
}

.close{
background:#718579;
}

</style>
</head>

<body>

<div id="home" class="screen">

<div class="homeCard">

<div class="logo">RUN BLAZE</div>

<div class="sub">Forest Runner</div>

<div style="font-weight:800;margin-bottom:10px">
Choose Runner
</div>

<div class="characters">

<button class="charBtn active" id="boyBtn">
<div class="charPreview">
<canvas id="boyPreview" width="70" height="80"></canvas>
</div>
BOY
</button>

<button class="charBtn" id="girlBtn">
<div class="charPreview">
<canvas id="girlPreview" width="70" height="80"></canvas>
</div>
GIRL
</button>

</div>

<button class="mainBtn" id="playBtn">
PLAY
</button>

<button class="smallBtn" id="settingsBtn">
SETTINGS
</button>

<div class="note">
Swipe ← → to move
</div>

<div class="note">
Swipe ↑ to jump • Swipe ↓ to slide
</div>

<div class="note">
Playtech Studio
</div>

</div>
</div>


<div id="game" class="screen">

<canvas id="canvas"></canvas>

<div id="hud">

<div class="hudBox">
SCORE <span id="score">0</span>
</div>

<div class="hudBox">
COINS <span id="coins">0</span>
</div>

<div class="hudBox">
KEYS <span id="keys">0</span>
</div>

<div class="hudBox">
BEST <span id="best">0</span>
</div>

</div>

<div id="hint">
SWIPE TO MOVE • JUMP • SLIDE
</div>

<div id="gameOver">

<div class="card">

<h2>GAME OVER</h2>

<div class="stats">

<div>
SCORE<br>
<span id="finalScore">0</span>
</div>

<div>
COINS<br>
<span id="finalCoins">0</span>
</div>

</div>

<button class="mainBtn" id="againBtn">
PLAY AGAIN
</button>

<button class="smallBtn" id="homeBtn">
HOME
</button>

</div>
</div>
</div>


<div id="settingsPanel" class="panel">

<div class="card">

<h2>SETTINGS</h2>

<button class="rowBtn primary" id="withdrawBtn">
WITHDRAWAL
</button>

<button class="rowBtn" id="soundBtn">
SOUND: ON
</button>

<button class="rowBtn" id="privacyBtn">
PRIVACY
</button>

<button class="rowBtn close" id="closeSettings">
CLOSE
</button>

</div>
</div>


<div id="withdrawPanel" class="panel">

<div class="card">

<h2>WITHDRAWAL</h2>

<p style="opacity:.7;margin-bottom:10px">
Choose withdrawal method
</p>

<button class="rowBtn" id="upiBtn">
UPI
</button>

<button class="rowBtn" id="bankBtn">
BANK ACCOUNT
</button>

<button class="rowBtn" id="paypalBtn">
PAYPAL
</button>

<button class="rowBtn close" id="backSettings">
BACK
</button>

</div>
</div>


<script>

"use strict";

const home=document.getElementById("home");
const game=document.getElementById("game");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

let selected="boy";
let running=false;

let score=0;
let coins=0;
let keys=0;

let best=Number(
localStorage.getItem("runBlazeBest")||0
);

let lane=0;
let targetLane=0;

let jump=0;
let slide=0;

let speed=.42;
let objects=[];

let spawnTimer=.3;
let last=0;
let phase=0;

let magnet=0;
let booster=0;
let shoes=0;

let sx=0;
let sy=0;

document.getElementById("best").textContent=best;


/* RESIZE */

function resize(){

W=innerWidth;
H=innerHeight;

const d=Math.min(
devicePixelRatio||1,
2
);

canvas.width=W*d;
canvas.height=H*d;

ctx.setTransform(
d,0,0,d,0,0
);
}

addEventListener("resize",resize);
resize();


/* CHARACTER */

function runner(c,x,y,s,type,t){

c.save();

c.translate(x,y);
c.scale(s,s);

const bob=
Math.sin(t*8)*2;

const leg=
Math.sin(t*8)*11;

const arm=
Math.sin(t*8+Math.PI)*10;


/* legs */

c.strokeStyle="#17222a";
c.lineWidth=7;
c.lineCap="round";

c.beginPath();
c.moveTo(-5,27);
c.lineTo(-10+leg,52);
c.stroke();

c.beginPath();
c.moveTo(5,27);
c.lineTo(10-leg,52);
c.stroke();


/* arms */

c.beginPath();
c.moveTo(-11,5);
c.lineTo(-19+arm,24);
c.stroke();

c.beginPath();
c.moveTo(11,5);
c.lineTo(19-arm,24);
c.stroke();


/* body */

c.fillStyle=
type==="boy"
?"#1976b8"
:"#c42d73";

c.beginPath();
c.roundRect(
-14,0,28,34,8
);
c.fill();


/* head */

c.fillStyle="#d99b73";

c.beginPath();

c.arc(
0,
-14+bob,
14,
0,
Math.PI*2
);

c.fill();


/* hair */

c.fillStyle="#17202a";

if(type==="boy"){

c.beginPath();

c.arc(
0,
-19+bob,
14,
Math.PI,
Math.PI*2
);

c.fill();

}else{

c.beginPath();

c.arc(
0,
-20+bob,
15,
Math.PI,
Math.PI*2
);

c.fill();

c.fillRect(
-15,
-19+bob,
5,
25
);

c.fillRect(
10,
-19+bob,
5,
25
);
}

c.restore();
}


function preview(id,type){

const c=
document.getElementById(id)
.getContext("2d");

c.clearRect(0,0,70,80);

runner(
c,
35,
25,
.9,
type,
0
);
}

preview("boyPreview","boy");
preview("girlPreview","girl");


document.getElementById("boyBtn")
.onclick=()=>{

selected="boy";

document.getElementById(
"boyBtn"
).classList.add("active");

document.getElementById(
"girlBtn"
).classList.remove("active");
};


document.getElementById("girlBtn")
.onclick=()=>{

selected="girl";

document.getElementById(
"girlBtn"
).classList.add("active");

document.getElementById(
"boyBtn"
).classList.remove("active");
};


/* GAME START */

function startGame(){

home.style.display="none";
game.style.display="block";

document.getElementById(
"gameOver"
).style.display="none";

running=true;

score=0;
coins=0;
keys=0;

lane=0;
targetLane=0;

jump=0;
slide=0;

magnet=0;
booster=0;
shoes=0;

speed=.42;

objects=[];

spawnTimer=.2;

last=performance.now();

document.getElementById("score")
.textContent="0";

document.getElementById("coins")
.textContent="0";

document.getElementById("keys")
.textContent="0";

requestAnimationFrame(loop);
}

document.getElementById(
"playBtn"
).onclick=startGame;

document.getElementById(
"againBtn"
).onclick=startGame;


/* HOME */

document.getElementById(
"homeBtn"
).onclick=()=>{

running=false;

game.style.display="none";
home.style.display="flex";

document.getElementById(
"gameOver"
).style.display="none";
};


/* SWIPE */

function left(){

targetLane=
Math.max(-1,targetLane-1);
}

function right(){

targetLane=
Math.min(1,targetLane+1);
}

function jumpUp(){

if(jump<=0)
jump=1;
}

function slideDown(){

if(jump<=0)
slide=.55;
}


addEventListener(
"touchstart",
e=>{

if(!running)return;

const t=e.changedTouches[0];

sx=t.clientX;
sy=t.clientY;

},
{passive:true}
);


addEventListener(
"touchend",
e=>{

if(!running)return;

const t=e.changedTouches[0];

const dx=t.clientX-sx;
const dy=t.clientY-sy;

if(
Math.max(
Math.abs(dx),
Math.abs(dy)
)<30
)return;

if(
Math.abs(dx)>
Math.abs(dy)
){

dx>0?right():left();

}else{

dy<0?jumpUp():slideDown();
}

},
{passive:true}
);


/* KEYBOARD */

addEventListener(
"keydown",
e=>{

if(!running)return;

if(e.key==="ArrowLeft")
left();

if(e.key==="ArrowRight")
right();

if(e.key==="ArrowUp"||e.key===" ")
jumpUp();

if(e.key==="ArrowDown")
slideDown();

}
);


/* ROAD */

function roadX(l){

return W/2+
l*Math.min(W*.22,180);
}


function forest(){

const horizon=H*.30;

ctx.fillStyle="#79a36e";
ctx.fillRect(0,0,W,H);

ctx.fillStyle="#274e2c";
ctx.fillRect(
0,
horizon,
W,
H-horizon
);


/* path */

ctx.fillStyle="#4d3d2d";

ctx.beginPath();

ctx.moveTo(
W*.43,
horizon
);

ctx.lineTo(
W*.57,
horizon
);

ctx.lineTo(
W*.78,
H
);

ctx.lineTo(
W*.22,
H
);

ctx.closePath();

ctx.fill();


/* trees */

for(
let i=0;
i<18;
i++
){

const side=
i%2===0?-1:1;

const x=
side*
(
W*.30+
(i%5)*35
)+W/2;

const y=
horizon-
(i%6)*35;

ctx.fillStyle="#493a27";

ctx.fillRect(
x-5,
y,
10,
80
);

ctx.fillStyle=
i%2
?"#163d20"
:"#20572b";

ctx.beginPath();

ctx.arc(
x,
y-10,
28,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
x-20,
y+10,
22,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
x+20,
y+10,
22,
0,
Math.PI*2
);

ctx.fill();
}


/* lane lines */

ctx.strokeStyle="#b89b63";
ctx.lineWidth=3;

for(
const n of [-.06,.06]
){

ctx.beginPath();

ctx.moveTo(
W/2+n*W,
horizon
);

ctx.lineTo(
W/2+n*W*3,
H
);

ctx.stroke();
}

}


/* OBJECT CREATION */

function add(type,l,z){

objects.push({
type:type,
lane:l,
z:z,
hit:false
});
}


function spawn(){

const l=
Math.floor(
Math.random()*3
)-1;

const r=Math.random();


if(r<.48){

add("coin",l,1);

if(Math.random()<.6)
add("coin",l,1.18);

if(Math.random()<.4)
add("coin",l,1.36);


}else if(r<.58){

add("key",l,1);

}else if(r<.68){

add("magnet",l,1);

}else if(r<.77){

add("booster",l,1);

}else if(r<.86){

add("shoes",l,1);

}else{

add("stone",l,1);
}

}


/* OBJECT DRAW */

function project(z){

const h=H*.30;

const t=1-Math.max(
0,
Math.min(1,z)
);

return{

y:h+t*(H-h),

s:.25+t*1.05

};
}


function objectDraw(o){

const p=project(o.z);

const x=roadX(o.lane);

ctx.save();

ctx.translate(
x,
p.y
);

ctx.scale(
p.s,
p.s
);


if(o.type==="coin"){

ctx.fillStyle="#ffd34d";

ctx.beginPath();

ctx.arc(
0,-18,
12,
0,
Math.PI*2
);

ctx.fill();

ctx.strokeStyle="#9b6900";
ctx.lineWidth=3;
ctx.stroke();


}else if(o.type==="key"){

ctx.strokeStyle="#ffe066";
ctx.lineWidth=7;

ctx.beginPath();

ctx.arc(
-5,-22,
8,
0,
Math.PI*2
);

ctx.stroke();

ctx.beginPath();

ctx.moveTo(
3,-15
);

ctx.lineTo(
20,-2
);

ctx.stroke();


}else if(o.type==="magnet"){

ctx.strokeStyle="#e52e3d";
ctx.lineWidth=9;

ctx.beginPath();

ctx.arc(
0,-18,
14,
0,
Math.PI
);

ctx.stroke();


}else if(o.type==="booster"){

ctx.fillStyle="#49d7ff";

ctx.beginPath();

ctx.moveTo(
0,-45
);

ctx.lineTo(
15,-15
);

ctx.lineTo(
5,-15
);

ctx.lineTo(
12,5
);

ctx.lineTo(
-15,-25
);

ctx.lineTo(
-4,-25
);

ctx.closePath();

ctx.fill();


}else if(o.type==="shoes"){

ctx.fillStyle="#ff6b35";

ctx.fillRect(
-20,-20,
35,
15
);

ctx.fillRect(
-10,-8,
30,
10
);


}else{

/* stone / barricade */

ctx.fillStyle="#655040";

ctx.beginPath();

ctx.roundRect(
-30,-50,
60,
50,
9
);

ctx.fill();

ctx.fillStyle="#8c7058";

ctx.fillRect(
-23,-40,
45,
8
);

ctx.fillStyle="#d0c09d";

ctx.fillRect(
-25,-24,
50,
8
);

}

ctx.restore();
}


/* UPDATE */

function update(dt){

lane+=
(targetLane-lane)*
Math.min(
1,
dt*12
);


if(jump>0)
jump=Math.max(
0,
jump-dt/.75
);


if(slide>0)
slide=Math.max(
0,
slide-dt
);


speed=Math.min(
.72,
speed+dt*.004
);


score+=
dt*100*speed;


document.getElementById(
"score"
).textContent=
Math.floor(score);


spawnTimer-=dt;

if(spawnTimer<=0){

spawn();

spawnTimer=
.55+
Math.random()*.4;
}


for(
let i=objects.length-1;
i>=0;
i--
){

const o=objects[i];

o.z-=speed*dt;


if(
magnet>0 &&
o.type==="coin" &&
o.z<.45
){

o.lane=lane;
}


const sameLane=
Math.abs(o.lane-lane)<.34;


if(
o.z<.08 &&
o.z>-.12 &&
sameLane &&
!o.hit
){

o.hit=true;


if(o.type==="stone"){

/* STONE = GAME OVER */

if(jump<.25){

endGame();

return;
}

}else{

collect(o);
}

}


if(o.z<-.2){

objects.splice(i,1);
}

}


if(magnet>0)
magnet-=dt;

if(booster>0)
booster-=dt;

if(shoes>0)
shoes-=dt;
}


/* COLLECT */

function collect(o){

if(o.type==="coin"){

coins++;

document.getElementById(
"coins"
).textContent=coins;

score+=50;

}

if(o.type==="key"){

keys++;

document.getElementById(
"keys"
).textContent=keys;

score+=100;
}

if(o.type==="magnet"){

magnet=8;

score+=150;
}

if(o.type==="booster"){

booster=6;

speed=Math.min(
.9,
speed+.25
);

score+=200;
}

if(o.type==="shoes"){

shoes=8;

score+=150;
}
}


/* GAME OVER */

function endGame(){

if(!running)return;

running=false;

if(score>best){

best=Math.floor(score);

localStorage.setItem(
"runBlazeBest",
best
);
}

document.getElementById(
"finalScore"
).textContent=
Math.floor(score);

document.getElementById(
"finalCoins"
).textContent=
coins;

document.getElementById(
"gameOver"
).style.display=
"flex";
}


/* DRAW */

function draw(){

forest();


const cx=roadX(lane);

let lift=0;

if(jump>0){

lift=
-Math.sin(
(1-jump)*Math.PI
)*H*.24;
}


if(slide>0){

ctx.save();

ctx.translate(
cx,
H*.79+lift+20
);

ctx.scale(
1.25,
.7
);

runner(
ctx,
0,
0,
1.15,
selected,
phase
);

ctx.restore();

}else{

runner(
ctx,
cx,
H*.79+lift,
1.15,
selected,
phase
);
}


for(
const o of objects
){

objectDraw(o);
}
}


/* LOOP */

function loop(now){

if(!running)return;

const dt=Math.min(
.035,
(now-last)/1000
);

last=now;

phase+=dt;

update(dt);

draw();

if(running)
requestAnimationFrame(loop);
}


/* SETTINGS */

const settings=
document.getElementById(
"settingsPanel"
);

const withdrawal=
document.getElementById(
"withdrawPanel"
);


document.getElementById(
"settingsBtn"
).onclick=()=>{

settings.style.display="flex";
};


document.getElementById(
"closeSettings"
).onclick=()=>{

settings.style.display="none";
};


document.getElementById(
"withdrawBtn"
).onclick=()=>{

settings.style.display="none";

withdrawal.style.display="flex";
};


document.getElementById(
"backSettings"
).onclick=()=>{

withdrawal.style.display="none";

settings.style.display="flex";
};


document.getElementById(
"soundBtn"
).onclick=function(){

this.textContent=
this.textContent==="SOUND: ON"
?"SOUND: OFF"
:"SOUND: ON";
};


document.getElementById(
"privacyBtn"
).onclick=()=>{

alert(
"Privacy settings will be connected before Play Store launch."
);
};


/* WITHDRAWAL METHODS */

function withdrawal(method){

alert(
method+
" selected. Real-money withdrawal requires a compliant payout backend and required approvals."
);
}


document.getElementById(
"upiBtn"
).onclick=()=>{
withdrawal("UPI");
};


document.getElementById(
"bankBtn"
).onclick=()=>{
withdrawal("Bank Account");
};


document.getElementById(
"paypalBtn"
).onclick=()=>{
withdrawal("PayPal");
};


/* STOP PAGE SCROLL WHILE PLAYING */

addEventListener(
"touchmove",
e=>{

if(running)
e.preventDefault();

},
{passive:false}
);

</script>

</body>
</html>
