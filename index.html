<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07110d">
<title>Run Blaze</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#030706;color:#fff;font-family:Arial,sans-serif;
}
button{
  border:0;color:white;font-weight:900;cursor:pointer;
  font-size:17px;border-radius:18px;
}
#app{position:fixed;inset:0;overflow:hidden}
.screen{
  position:absolute;inset:0;display:none;
  align-items:center;justify-content:center;
}
.screen.active{display:flex}

/* HOME */
#home{
  background:
    radial-gradient(circle at 50% 20%,rgba(255,126,45,.22),transparent 28%),
    linear-gradient(180deg,#10251b 0%,#06110c 48%,#020504 100%);
}
#home:before{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(90deg,rgba(0,0,0,.7),transparent 30%,transparent 70%,rgba(0,0,0,.7)),
    repeating-linear-gradient(80deg,transparent 0 75px,rgba(35,70,45,.18) 76px 80px);
}
.homeBox{
  position:relative;z-index:2;width:min(440px,92vw);
  text-align:center;padding:25px;
}
.logo{
  font-size:clamp(42px,12vw,76px);
  font-weight:1000;letter-spacing:5px;
  color:#ff9b4a;
  text-shadow:0 5px 0 #7d3218,0 0 35px rgba(255,110,35,.5);
}
.subtitle{
  letter-spacing:5px;color:#b7c3bc;font-size:12px;
  margin-top:-5px;margin-bottom:40px;
}
.choose{font-size:20px;margin-bottom:15px}
.runners{display:flex;gap:12px;margin-bottom:20px}
.runner{
  flex:1;padding:18px 8px;
  background:rgba(255,255,255,.06);
  border:2px solid transparent;
}
.runner.selected{
  border-color:#ff9148;
  background:rgba(255,125,45,.13);
  box-shadow:0 0 25px rgba(255,100,30,.2);
}
.runner span{font-size:28px;display:block;margin-bottom:7px}
.mainBtn{
  width:100%;padding:19px;margin-top:8px;
  background:linear-gradient(135deg,#ffb04f,#ef5835);
  box-shadow:0 8px 25px rgba(255,90,35,.3);
}
.settingsBtn{
  width:100%;padding:17px;margin-top:12px;
  background:rgba(255,255,255,.08);
}
.studio{
  margin-top:28px;
  color:#89958e;
  font-size:12px;
  letter-spacing:3px;
}

/* GAME */
#game{
  background:#06100b;
}

#gameCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.hud{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  z-index:5;
  pointer-events:none;
}

.hudBox{
  background:rgba(0,0,0,.48);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);
  padding:9px 13px;
  border-radius:14px;
  font-weight:900;
  font-size:14px;
}

.powerups{
  position:absolute;
  top:62px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  z-index:5;
  pointer-events:none;
}

.power{
  display:none;
  padding:7px 10px;
  border-radius:12px;
  background:rgba(0,0,0,.55);
  font-size:12px;
  font-weight:bold;
}

#hint{
  position:absolute;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  background:rgba(0,0,0,.48);
  padding:10px 16px;
  border-radius:20px;
  color:#d9e3dd;
  font-size:12px;
  text-align:center;
  white-space:nowrap;
}

/* SETTINGS */
.panel{
  width:min(430px,92vw);
  padding:25px;
  background:rgba(9,17,13,.96);
  border:1px solid rgba(255,145,72,.3);
  border-radius:25px;
  box-shadow:0 20px 70px #000;
}

.panel h2{
  margin-top:0;
  color:#ff9b4a;
}

.option{
  width:100%;
  padding:16px;
  margin:8px 0;
  background:rgba(255,255,255,.07);
  text-align:left;
}

.back{
  background:#252b28;
}

.withdraw{
  background:linear-gradient(135deg,#e96b37,#a92d22);
}

.withdrawPanel{
  display:none;
  margin-top:15px;
}

.withdrawPanel input{
  width:100%;
  padding:14px;
  margin:5px 0;
  border-radius:12px;
  border:1px solid #555;
  background:#101713;
  color:#fff;
}

.withdrawPanel button{
  width:100%;
  padding:13px;
  margin-top:6px;
}

.small{
  font-size:11px;
  color:#8c9991;
}

/* GAME OVER */
#over{
  background:rgba(1,4,3,.88);
  backdrop-filter:blur(9px);
}

.overBox{
  width:min(400px,90vw);
  text-align:center;
  padding:30px;
  background:#0b1510;
  border:1px solid #59301d;
  border-radius:25px;
}

.overBox h1{
  font-size:40px;
  color:#ff7040;
  margin:5px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:20px 0;
}

.stat{
  background:#121d17;
  padding:15px;
  border-radius:14px;
}

.stat b{
  display:block;
  font-size:24px;
  color:#ffad57;
  margin-top:4px;
}
</style>
</head>

<body>

<div id="app">

<section id="home" class="screen active">

  <div class="homeBox">

    <div class="logo">RUN BLAZE</div>

    <div class="subtitle">
      FOREST ENDLESS RUNNER
    </div>

    <div class="choose">
      CHOOSE RUNNER
    </div>

    <div class="runners">

      <button class="runner selected" data-runner="boy">
        <span>🏃</span>
        BOY
      </button>

      <button class="runner" data-runner="girl">
        <span>🏃‍♀️</span>
        GIRL
      </button>

    </div>

    <button id="playBtn" class="mainBtn">
      ▶ PLAY
    </button>

    <button id="settingsBtn" class="settingsBtn">
      ⚙ SETTINGS
    </button>

    <div class="studio">
      PLAYTECH STUDIO
    </div>

  </div>

</section>


<section id="game" class="screen">

  <canvas id="gameCanvas"></canvas>

  <div class="hud">

    <div class="hudBox">
      🏃 <span id="score">0</span>
    </div>

    <div class="hudBox">
      🪙 <span id="coins">0</span>
    </div>

    <div class="hudBox">
      ⭐ <span id="stars">0</span>
    </div>

  </div>

  <div class="powerups">

    <div id="magnetPower" class="power">
      🧲 MAGNET
    </div>

    <div id="shieldPower" class="power">
      🛡 SHIELD
    </div>

    <div id="shoesPower" class="power">
      👟 BOOST
    </div>

  </div>

  <div id="hint">
    SWIPE ← → TO MOVE • ↑ JUMP • ↓ SLIDE
  </div>

</section>


<section id="settings" class="screen">

  <div class="panel">

    <h2>⚙ SETTINGS</h2>

    <button id="soundBtn" class="option">
      🔊 Sound: ON
    </button>

    <button id="withdrawBtn" class="option withdraw">
      💰 WITHDRAWAL
    </button>

    <div id="withdrawPanel" class="withdrawPanel">

      <input
        id="upiInput"
        placeholder="UPI ID"
      >

      <button data-method="UPI" class="option">
        Withdraw via UPI
      </button>

      <input
        id="bankInput"
        placeholder="Bank Account Number"
      >

      <input
        id="ifscInput"
        placeholder="IFSC Code"
      >

      <button data-method="Bank Account" class="option">
        Withdraw via Bank
      </button>

      <input
        id="paypalInput"
        placeholder="PayPal Email"
      >

      <button data-method="PayPal" class="option">
        Withdraw via PayPal
      </button>

      <div id="withdrawMessage" class="small"></div>

    </div>

    <button id="controlsBtn" class="option">
      🎮 CONTROLS
    </button>

    <button id="studioBtn" class="option">
      🏢 PLAYTECH STUDIO
    </button>

    <button id="backBtn" class="option back">
      ← BACK
    </button>

  </div>

</section>


<section id="over" class="screen">

  <div class="overBox">

    <div class="small">
      RUN ENDED
    </div>

    <h1>
      GAME OVER
    </h1>

    <div class="stats">

      <div class="stat">
        SCORE
        <b id="finalScore">0</b>
      </div>

      <div class="stat">
        BEST
        <b id="bestScore">0</b>
      </div>

      <div class="stat">
        COINS
        <b id="finalCoins">0</b>
      </div>

      <div class="stat">
        STARS
        <b id="finalStars">0</b>
      </div>

    </div>

    <button id="againBtn" class="mainBtn">
      ↻ RUN AGAIN
    </button>

    <button id="homeBtn" class="settingsBtn">
      ⌂ HOME
    </button>

  </div>

</section>

</div>


<script>
(function(){

"use strict";


function $(id){
  return document.getElementById(id);
}


const screens = {
  home: $("home"),
  game: $("game"),
  settings: $("settings"),
  over: $("over")
};


function showScreen(name){

  Object.keys(screens).forEach(function(key){

    screens[key].classList.remove("active");

  });

  if(screens[name]){
    screens[name].classList.add("active");
  }
}


/* GAME STATE */

let runner = "boy";

let soundOn = true;

let playing = false;

let gameOver = false;

let lane = 1;

let targetLane = 1;

let score = 0;

let coins = 0;

let stars = 0;

let speed = 0.34;

let distance = 0;

let jumping = false;

let sliding = false;

let jumpTime = 0;

let slideTime = 0;

let magnet = 0;

let shield = 0;

let shoes = 0;

let objects = [];

let lastTime = 0;

let spawnTimer = 0;

let touchStartX = 0;

let touchStartY = 0;


/* CANVAS */

const canvas = $("gameCanvas");

const ctx = canvas.getContext("2d");

let W = 0;

let H = 0;


function resize(){

  W = window.innerWidth;

  H = window.innerHeight;

  const ratio =
    Math.min(window.devicePixelRatio || 1,2);

  canvas.width =
    Math.floor(W * ratio);

  canvas.height =
    Math.floor(H * ratio);

  canvas.style.width =
    W + "px";

  canvas.style.height =
    H + "px";

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );
}


window.addEventListener(
  "resize",
  resize
);

resize();


/* RUNNER */

document
.querySelectorAll(".runner")
.forEach(function(btn){

  btn.addEventListener(
    "click",
    function(){

      document
      .querySelectorAll(".runner")
      .forEach(function(b){

        b.classList.remove("selected");

      });

      btn.classList.add("selected");

      runner =
        btn.dataset.runner;

    }
  );

});


/* START GAME */

function startGame(){

  playing = true;

  gameOver = false;

  lane = 1;

  targetLane = 1;

  score = 0;

  coins = 0;

  stars = 0;

  speed = 0.34;

  distance = 0;

  jumping = false;

  sliding = false;

  jumpTime = 0;

  slideTime = 0;

  magnet = 0;

  shield = 0;

  shoes = 0;

  objects = [];

  spawnTimer = 0;

  updateHUD();

  updatePowerups();

  showScreen("game");

  lastTime =
    performance.now();

  requestAnimationFrame(loop);
}


/* HUD */

function updateHUD(){

  $("score").textContent =
    Math.floor(score);

  $("coins").textContent =
    coins;

  $("stars").textContent =
    stars;
}


function updatePowerups(){

  $("magnetPower").style.display =
    magnet > 0
    ? "block"
    : "none";

  $("shieldPower").style.display =
    shield > 0
    ? "block"
    : "none";

  $("shoesPower").style.display =
    shoes > 0
    ? "block"
    : "none";
}


/* SPAWN */

function spawnObject(){

  const types = [

    "coin",
    "coin",
    "coin",
    "star",
    "magnet",
    "shield",
    "shoes",
    "stone",
    "barricade"

  ];

  const type =
    types[
      Math.floor(
        Math.random() * types.length
      )
    ];

  objects.push({

    type:type,

    lane:
      Math.floor(
        Math.random() * 3
      ),

    z:1,

    collected:false

  });
}


/* LANE */

function laneX(laneNumber,z){

  const center = W / 2;

  const roadWidth =
    W * (0.12 + z * 0.72);

  const laneWidth =
    roadWidth / 3;

  return center +
    (laneNumber - 1) *
    laneWidth;
}


/* BACKGROUND */

function drawBackground(){

  const sky =
    ctx.createLinearGradient(
      const sky =
  ctx.createLinearGradient(
    0,
    0,
    0,
    H
  );

sky.addColorStop(
  0,
  "#07130f"
);

sky.addColorStop(
  0.45,
  "#123321"
);

sky.addColorStop(
  1,
  "#020604"
);

ctx.fillStyle = sky;

ctx.fillRect(
  0,
  0,
  W,
  H
);


/* MOON LIGHT */

ctx.beginPath();

ctx.arc(
  W * 0.78,
  H * 0.17,
  55,
  0,
  Math.PI * 2
);

ctx.fillStyle =
  "rgba(255,220,160,.12)";

ctx.fill();


/* FOREST TREES */

for(let i = 0; i < 18; i++){

  const side =
    i % 2 === 0
    ? -1
    : 1;

  const x =
    side < 0
    ? (i / 18) * W * 0.45
    : W - (i / 18) * W * 0.45;

  const treeH = 70 + Math.random() * 90;
const treeW = treeH * 0.42;
const tx = Math.random() * W;

ctx.fillStyle = "#12351f";
ctx.fillRect(
  tx,
  horizon - treeH,
  treeW,
  treeH
);

ctx.beginPath();
ctx.fillStyle = "#1d5a2c";
ctx.moveTo(tx - treeW * 0.8, horizon - treeH * 0.45);
ctx.lineTo(tx + treeW * 0.5, horizon - treeH * 1.15);
ctx.lineTo(tx + treeW * 1.8, horizon - treeH * 0.45);
ctx.closePath();
ctx.fill();

ctx.beginPath();
ctx.fillStyle = "#26723a";
ctx.moveTo(tx - treeW, horizon - treeH * 0.15);
ctx.lineTo(tx + treeW * 0.5, horizon - treeH * 0.85);
ctx.lineTo(tx + treeW * 2, horizon - treeH * 0.15);
ctx.closePath();
ctx.fill();

for(let i = 0; i < 18; i++){
  const treeH = 70 + Math.random() * 90;
  const treeW = treeH * 0.42;
  const tx = Math.random() * W;

  ctx.fillStyle = "#12351f";
  ctx.fillRect(
    tx,
    horizon - treeH,
    treeW,
    treeH
  );

  ctx.beginPath();
  ctx.fillStyle = "#1d5a2c";
  ctx.moveTo(
    tx - treeW * 0.8,
    horizon - treeH * 0.45
  );
  ctx.lineTo(
    tx + treeW * 0.5,
    horizon - treeH * 1.15
  );
  ctx.lineTo(
    tx + treeW * 1.8,
    horizon - treeH * 0.45
  );
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.fillStyle = "#26723a";
  ctx.moveTo(
    tx - treeW,
    horizon - treeH * 0.15
  );
  ctx.lineTo(
    tx + treeW * 0.5,
    horizon - treeH * 0.85
  );
  ctx.lineTo(
    tx + treeW * 2,
    horizon - treeH * 0.15
  );
  ctx.closePath();
  ctx.fill();
}

function drawRoad(){

  const horizon = H * 0.38;

  ctx.fillStyle = "#30343b";
  ctx.beginPath();

  ctx.moveTo(W * 0.42, horizon);
  ctx.lineTo(W * 0.58, horizon);
  ctx.lineTo(W * 0.98, H);
  ctx.lineTo(W * 0.02, H);

  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = "#555b63";
  ctx.lineWidth = 5;

  ctx.beginPath();
  ctx.moveTo(W * 0.42, horizon);
  ctx.lineTo(W * 0.02, H);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(W * 0.58, horizon);
  ctx.lineTo(W * 0.98, H);
  ctx.stroke();

  for(let i = 1; i < 3; i++){

    const bottomX = W * (i / 3);

    ctx.strokeStyle = "#d9d9d9";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(
      W * 0.42 + (W * 0.16) * (i / 3),
      horizon
    );

    ctx.lineTo(
      bottomX,
      H
    );

    ctx.stroke();
  }
}

function drawObject(o){

  const p = Math.max(0, Math.min(1, o.z));

  const y =
    H * 0.38 +
    p * (H * 0.55);

  const roadHalf =
    W * 0.08 +
    p * W * 0.42;

  const x =
    W / 2 +
    (o.lane - 1) 
    roadHalf *
    0.62;

  const s = 0.
  const s =
  0.25 + p * 1.15;

ctx.save();

ctx.translate(x, y);
ctx.scale(s, s);

if(o.type === "coin"){

  ctx.fillStyle = "#ffd21f";

  ctx.beginPath();
  ctx.arc(
    0,
    0,
    13,
    0,
    Math.PI * 2
  );
  ctx.fill();

  ctx.strokeStyle = "#fff4a0";
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = "#9b6d00";
  ctx.font = "bold 14px Arial";
  ctx.textAlign = "center";
  ctx.fillText("C", 0, 5);

}else if(o.type === "star"){

  drawStar(
    0,
    0,
    16,
    "#ffe45c"
  );

}else if(o.type === "magnet"){

  drawPowerIcon(
    0,
    0,
    "#ff4b5c",
    "M"
  );

}else if(o.type === "shield"){

  drawPowerIcon(
    0,
    0,
    "#55bfff",
    "S"
  );

}else if(o.type === "shoes"){

  drawPowerIcon(
    0,
    0,
    "#7cff70",
    "⚡"
  );

}else if(o.type === "stone"){

  ctx.fillStyle = "#777";

  ctx.beginPath();

  ctx.moveTo(-22, 18);
  ctx.lineTo(-15, -12);
  ctx.lineTo(8, -20);
  ctx.lineTo(24, 5);
  ctx.lineTo(14, 22);

  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = "#aaa";
  ctx.lineWidth = 3;
  ctx.stroke();

}else if(o.type === "barricade"){

  ctx.fillStyle = "#f08b21";

  ctx.fillRect(
    -35,
    -12,
    70,
    18
  );

  ctx.fillStyle = "#fff";

  ctx.fillRect(
    -25,
    -12,
    12,
    18
  );

  ctx.fillRect(
    2,
    -12,
    12,
    18
  );

  ctx.fillStyle = "#222";

  ctx.fillRect(
    -28,
    6,
    7,
    30
  );

  ctx.fillRect(
    21,
    6,
    7,
    30
  );
}

ctx.restore();
}

function drawStar(x, y, r, color){

  ctx.fillStyle = color;

  ctx.beginPath();

  for(let i = 0; i < 10; i++){

    const a =
      -Math.PI / 2 +
      i * Math.PI / 5;

    const rr =
      i % 2 === 0
        ? r
        : r * 0.45;

    const px =
      x + Math.cos(a) * rr;

    const py =
      y + Math.sin(a) * rr;

    if(i === 0){
      ctx.moveTo(px, py);
    }else{
      ctx.lineTo(px, py);
    }
  }

  ctx.closePath();
  ctx.fill();
}

function drawPowerIcon(
  x,
  y,
  color,
  text
){

  ctx.fillStyle = color;

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    18,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.fillStyle = "#111";
  ctx.font = "bold 15px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText(
    text,
    x,
    y
  );
}

function drawPlayer(){

  const x =
    W / 2 +
    (lane - 1) * W * 0.17;

  const ground =
    H * 0.88;

  let y = ground;

  if(jumping){

    const t =
      Math.min(
        1,
        jumpTime / 0.8
      );

    y -=
      Math.sin(t * Math.PI) *
      H * 0.20;
  }

  ctx.save();

  ctx.translate(x, y);

  if(sliding){
    ctx.scale(1.25, 0.65);
  }

  ctx.fillStyle =
    "rgba(0,0,0,.35)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    7,
    30,
    9,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.strokeStyle =
    runner === "boy"
      ? "#183c72"
      : "#5b267d";

  ctx.lineWidth = 11;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(-8, -25);
  ctx.lineTo(-14, 5);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(8, -25);
  ctx.lineTo(14, 5);
  ctx.stroke();

  ctx.fillStyle =
    runner === "boy"
      ? "#2878d8"
      : "#d84b9b";

  ctx.beginPath();

  ctx.roundRect(
    -17,
    -72,
    34,
    48,
    10
  );

  ctx.fill();

  ctx.strokeStyle = "#f2bd91";
  ctx.lineWidth = 9;

  ctx.beginPath();
  ctx.moveTo(-14, -60);
  ctx.lineTo(-28, -35);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(14, -60);
  ctx.lineTo(28, -35);
  ctx.stroke();

  ctx.fillStyle = "#f2bd91";

  ctx.fillRect(
    -7,
    -82,
    14,
    13
  );

  ctx.beginPath();

  ctx.arc(
    0,
    -100,
    20,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.fillStyle = "#20150e";

  ctx.beginPath();

  ctx.arc(
    0,
    -106,
    21,
    Math.PI,
    Math.PI * 2
  );

  ctx.fill();

  if(runner === "girl"){

    ctx.beginPath();

    ctx.arc(
      -18,
      -96,
      11,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
      18,
      -96,
      11,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }

  ctx.restore();
}

function laneX(laneNumber, z){

  const p =
    Math.max(
      0,
      Math.min(1, z)
    );

  const roadWidth =
    W * (
      0.16 +
      p * 0.72
    );

  return (
    W / 2 +
    (laneNumber - 1) *
    roadWidth *
    0.32
  );
}

function spawnObject(){

  const types = [
    "coin",
    "coin",
    "coin",
    "star",
    "magnet",
    "shield",
    "shoes",
    "stone",
    "barricade"
  ];

  const type =
    types[
      Math.floor(
        Math.random() *
        types.length
      )
    ];

  objects.push({
    type: type,
    lane: Math.floor(
      Math.random() * 3
    ),
    z: 0
  });
}

function collision(o){

  if(
    o.lane !== Math.round(lane) ||
    o.z < 0.78 ||
    o.z > 1.05
  ){
    return false;
  }

  if(
    o.type === "stone" ||
    o.type === "barricade"
  ){

    if(jumping){
      return false;
    }

    if(shield > 0){

      shield = 0;
      return false;
    }

    return true;
  }

  return false;
}

function collect(o){

  if(o.type === "coin"){
    coins++;
  }

  if(o.type === "star"){
    stars++;
  }

  if(o.type === "magnet"){
    magnet = 8;
  }

  if(o.type === "shield"){
    shield = 8;
  }

  if(o.type === "shoes"){
    shoes = 8;
  }
}
function updateHUD(){

  if(scoreEl){
    scoreEl.textContent =
      "SCORE " + Math.floor(score);
  }

  if(coinsEl){
    coinsEl.textContent =
      "🪙 " + coins;
  }

  if(starsEl){
    starsEl.textContent =
      "⭐ " + stars;
  }
}

function updatePowerups(){

  if(magnetEl){
    magnetEl.textContent =
      magnet > 0
        ? "🧲 " + Math.ceil(magnet)
        : "";
  }

  if(shieldEl){
    shieldEl.textContent =
      shield > 0
        ? "🛡️ " + Math.ceil(shield)
        : "";
  }

  if(shoesEl){
    shoesEl.textContent =
      shoes > 0
        ? "👟 " + Math.ceil(shoes)
        : "";
  }
}

function update(dt){

  if(!playing || gameOver){
    return;
  }

  score += dt * 10;

  distance += dt * speed;

  if(jumping){

    jumpTime += dt;

    if(jumpTime >= 0.8){
      jumping = false;
      jumpTime = 0;
    }
  }

  if(sliding){

    slideTime += dt;

    if(slideTime >= 0.65){
      sliding = false;
      slideTime = 0;
    }
  }

  if(magnet > 0){
    magnet -= dt;
  }

  if(shield > 0){
    shield -= dt;
  }

  if(shoes > 0){
    shoes -= dt;
  }

  targetLane =
    Math.max(
      0,
      Math.min(2, targetLane)
    );

  lane +=
    (targetLane - lane) *
    Math.min(1, dt * 12);

  spawnTimer -= dt;

  if(spawnTimer <= 0){

    spawnObject();

    spawnTimer =
      Math.max(
        0.35,
        0.75 - speed * 0.3
      );
  }

  for(
    let i = objects.length - 1;
    i >= 0;
    i--
  ){

    const o = objects[i];

    o.z +=
      dt * (0.45 + speed);

    if(
      o.type === "coin" &&
      magnet > 0 &&
      Math.abs(o.lane - lane) < 1.5 &&
      o.z > 0.55
    ){
      o.lane =
        Math.round(lane);
    }

    if(
      o.z > 0.72 &&
      o.z < 1.03
    ){

      if(
        o.type !== "stone" &&
        o.type !== "barricade" &&
        o.lane === Math.round(lane)
      ){

        collect(o);

        objects.splice(i, 1);

        continue;
      }

      if(collision(o)){

        objects.splice(i, 1);

        endGame();

        return;
      }
    }

    if(o.z > 1.15){
      objects.splice(i, 1);
    }
  }

  updateHUD();
  updatePowerups();
}

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawBackground();
  drawRoad();

  objects
    .slice()
    .sort(
      (a,b) => a.z - b.z
    )
    .forEach(drawObject);

  drawPlayer();
}

function loop(time){

  if(!playing){
    return;
  }

  if(!lastTime){
    lastTime = time;
  }

  const dt =
    Math.min(
      0.035,
      (time - lastTime) / 1000
    );

  lastTime = time;

  update(dt);
  draw();

  if(playing){
    requestAnimationFrame(loop);
  }
} 
  function moveLeft(){

  if(!playing) return;

  targetLane =
    Math.max(
      0,
      targetLane - 1
    );
}

function moveRight(){

  if(!playing) return;

  targetLane =
    Math.min(
      2,
      targetLane + 1
    );
}

function jump(){

  if(
    !playing ||
    jumping ||
    sliding
  ){
    return;
  }

  jumping = true;
  jumpTime = 0;
}

function slide(){

  if(
    !playing ||
    jumping ||
    sliding
  ){
    return;
  }

  sliding = true;
  slideTime = 0;
}

function startGame(){

  playing = true;
  gameOver = false;

  lane = 1;
  targetLane = 1;

  score = 0;
  coins = 0;
  stars = 0;

  speed = 0.34;
  distance = 0;

  jumping = false;
  sliding = false;

  jumpTime = 0;
  slideTime = 0;

  magnet = 0;
  shield = 0;
  shoes = 0;

  objects = [];

  spawnTimer = 0.3;
  lastTime = 0;

  showScreen("game");

  updateHUD();
  updatePowerups();

  requestAnimationFrame(loop);
}

function endGame(){

  playing = false;
  gameOver = true;

  const finalScore =
    Math.floor(score);

  const best =
    Number(
      localStorage.getItem(
        "runBlazeBest"
      ) || 0
    );

  if(finalScore > best){

    localStorage.setItem(
      if(finalScoreEl){
  finalScoreEl.textContent =
    finalScore;
}

if(finalCoinsEl){
  finalCoinsEl.textContent =
    coins;
}

if(finalStarsEl){
  finalStarsEl.textContent =
    stars;
}

if(bestEl){
  bestEl.textContent =
    Math.max(
      best,
      finalScore
    );
}

showScreen("over");
}

playBtn.addEventListener(
  "click",
  startGame
);

settingsBtn.addEventListener(
  "click",
  function(){
    showScreen("settings");
  }
);

backHomeBtn.addEventListener(
  "click",
  function(){
    showScreen("home");
  }
);

againBtn.addEventListener(
  "click",
  startGame
);

homeBtn.addEventListener(
  "click",
  function(){
    playing = false;
    showScreen("home");
  }
);

soundBtn.addEventListener(
  "click",
  function(){

    soundOn = !soundOn;

    soundBtn.textContent =
      soundOn
        ? "🔊 Sound ON"
        : "🔇 Sound OFF";
  }
);

withdrawBtn.addEventListener(
  "click",
  function(){

    withdrawalPanel.style.display =
      withdrawalPanel.style.display === "none"
        ? "block"
        : "none";
  }
);

document
  .querySelectorAll(".withdrawMethod")
  .forEach(
    function(btn){

      btn.addEventListener(
        "click",
        function(){

          const method =
            btn.dataset.method;

          withdrawalPanel.style.display =
            "block";

          withdrawalTitle.textContent =
            "Withdraw via " + method;

          withdrawalMessage.textContent =
            "Withdrawal setup is shown for the game UI. Real-money payouts require a secure verified backend and payment provider.";
        }
      );
    }
  );

window.addEventListener(
  "resize",
  resize
);

resize();

showScreen("home");

draw();

})();
</script>
